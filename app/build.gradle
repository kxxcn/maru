def loadReleaseSigningInfo() {
    def infoFile = rootProject.file("keystore/key_information.txt")
    if (!infoFile.exists()) {
        throw new GradleException("Release signing info file is missing: ${infoFile}")
    }

    def signingInfo = infoFile.text.split(/\r?\n\r?\n/)
        .collect { section ->
            def fields = [:]
            section.readLines().each { line ->
                def matcher = line =~ /^\s*([^:]+?)\s*:\s*(.*?)\s*$/
                if (matcher.matches()) {
                    fields[matcher.group(1).trim()] = matcher.group(2).trim()
                }
            }
            fields
        }
        .find { fields ->
            fields.KEY == "key_maru" || fields.PATH?.endsWith("/key_maru.jks")
        }

    if (signingInfo == null) {
        throw new GradleException("Release signing info for key_maru is missing.")
    }

    def keyName = signingInfo.KEY
    def keyFileName = keyName.endsWith(".jks") ? keyName : "${keyName}.jks"
    def keyFile = signingInfo.PATH ? rootProject.file(signingInfo.PATH) : rootProject.file("keystore/${keyFileName}")
    if (!keyFile.exists()) {
        throw new GradleException("Release keystore file is missing: ${keyFile}")
    }

    return [
        storeFile: keyFile,
        alias    : signingInfo.ALIAS,
        password : signingInfo.PASS
    ]
}

android {
    namespace 'dev.kxxcn.maru'
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        applicationId "dev.kxxcn.maru"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode 33
        versionName "2.0.2"

        testInstrumentationRunner 'dev.kxxcn.maru.CustomTestRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            def signingInfo = loadReleaseSigningInfo()
            storeFile signingInfo.storeFile
            storePassword signingInfo.password
            keyAlias signingInfo.alias
            keyPassword signingInfo.password
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            testCoverageEnabled true
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-rules.pro'
            proguardFile 'proguard-firebase.pro'
            proguardFile 'proguard-retrofit.pro'
            proguardFile 'proguard-gson.pro'
            proguardFile 'proguard_glide.pro'
            proguardFile 'proguard-debug.pro'
        }

        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-rules.pro'
            proguardFile 'proguard-firebase.pro'
            proguardFile 'proguard-retrofit.pro'
            proguardFile 'proguard-gson.pro'
            proguardFile 'proguard_glide.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        dataBinding = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "500"
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

